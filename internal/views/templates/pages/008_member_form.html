{{ define "content" }}

<h1>Ajouter un membre</h1>

<form action="/members" method="post">

    <div class="mb-3">
        <label for="firstName" class="form-label">
            Prénom
        </label>

        <input
            type="text"
            class="form-control"
            id="firstName"
            name="FirstName"
            required
        >
    </div>

    <div class="mb-3">
        <label for="lastName" class="form-label">
            Nom
        </label>

        <input
            type="text"
            class="form-control"
            id="lastName"
            name="LastName"
            required
        >
    </div>

    <div class="mb-3">
        <label for="birthdate" class="form-label">
            Date de naissance
        </label>

        <input
            type="date"
            class="form-control"
            id="birthdate"
            name="Birthdate"
            required
        >
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">
            Email
        </label>

        <input
            type="email"
            class="form-control"
            id="email"
            name="Email"
        >
    </div>

    <button type="submit" class="btn btn-primary">
        Ajouter
    </button>

</form>

{{ end }}
